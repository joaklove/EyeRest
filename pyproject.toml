[project]
name = "eyerest"
version = "0.5.1"
description = "EyeRest - 屏幕使用节奏管理器（眨眼/远眺/活动/深度休息四层节奏）"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
# 开发模式入口（python -m pip install -e . 后可用 `eyerest` 命令启动）
# 发布 exe 请使用：pyinstaller EyeRest.spec --noconfirm
eyerest = "app.main:main"
