[project]
name = "eyerest"
version = "0.1.0"
description = "EyeRest - 低打扰用眼健康助手"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pywin32>=306",
    "pynput>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
# 开发模式入口（python -m pip install -e . 后可用 `eyerest` 命令启动）
# 发布 exe 请使用：pyinstaller EyeRest.spec --noconfirm
eyerest = "app.main:main"
